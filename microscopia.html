<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Microscopia 3D</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; overflow: hidden; background-color: #1a1a1a; color: white; }
        #canvas-container { width: 100vw; height: 100vh; position: relative; }
        .ui-panel { position: absolute; top: 20px; right: 20px; width: 280px; background: rgba(40, 44, 52, 0.9); padding: 15px; border-radius: 12px; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); }
        h2 { margin-top: 0; color: #4db8ff; font-size: 1.1rem; }
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.8rem; color: #ccc; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #4db8ff; }
        #lens-view { position: absolute; bottom: 30px; left: 30px; width: 160px; height: 160px; border-radius: 50%; border: 4px solid #333; background: black; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        #cell-image { width: 100%; height: 100%; object-fit: cover; filter: blur(10px); }
        .loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #4db8ff; }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div id="loader" class="loader">Carregando Microscópio 3D...</div>
        <div class="ui-panel">
            <h2>Laboratório Virtual</h2>
            <div class="control-group">
                <label>Foco Macrométrico</label>
                <input type="range" id="macro-focus" min="0" max="100" value="0">
            </div>
            <div class="control-group">
                <label>Foco Micrométrico</label>
                <input type="range" id="micro-focus" min="0" max="100" value="50">
            </div>
            <div id="status-text" style="font-size: 0.8rem; color: #aaa;">Ajuste o foco para visualizar a lâmina.</div>
        </div>
        <div id="lens-view">
            <img id="cell-image" src="https://images.unsplash.com/photo-1576086213369-97a306d36557?q=80&w=500" alt="Célula">
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x121212);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 2, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const light1 = new THREE.DirectionalLight(0xffffff, 2);
        light1.position.set(2, 5, 2);
        scene.add(light1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));

        const controls = new OrbitControls(camera, renderer.domElement);
        const loader = new GLTFLoader();
        
     loader.load('microscope.glb', (gltf) => {
            const model = gltf.scene;
            
            // --- Lógica de Enquadramento Automático ---
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            
            // Calcula a escala para que o modelo tenha um tamanho padrão
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 3 / maxDim; // O número 3 define o "tamanho visual"
            model.scale.set(scale, scale, scale);
            
            // Centraliza o modelo na cena
            model.position.x += (model.position.x - center.x) * scale;
            model.position.y += (model.position.y - center.y) * scale;
            model.position.z += (model.position.z - center.z) * scale;
            // ------------------------------------------

            scene.add(model);
            document.getElementById('loader').style.display = 'none';
        }, undefined, (error) => {
            console.error(error);
        });

        const macro = document.getElementById('macro-focus');
        const micro = document.getElementById('micro-focus');
        const img = document.getElementById('cell-image');
        const targetFocus = Math.random() * 80 + 10;

        function update() {
            const val = parseFloat(macro.value) + (parseFloat(micro.value) - 50) / 10;
            const blur = Math.abs(val - targetFocus);
            img.style.filter = `blur(${Math.min(blur, 20)}px)`;
        }

        macro.oninput = update;
        micro.oninput = update;

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
